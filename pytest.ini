[pytest]
addopts = -v -s --alluredir ./report/result --clean-alluredir
testpaths = ./testcases
python_files = test_*.py
python_classes = Test*
python_functions = test_*
markers =
    smoke: 冒烟用例（正向主流程）
    regression: 回归用例
    p0: 最高优先级
    p1: 高优先级
    security: 权限/鉴权/注入/XSS 等安全校验
    boundary: 参数边界与类型校验
    contract: 接口契约/响应结构校验
    e2e: 全链路场景
    known_bug: 已确认缺陷（用例以 xfail 标记，修复后 XPASS）
